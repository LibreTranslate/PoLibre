# Builds PoLibre for every major platform when a GitHub release is published
# and attaches the archives to that release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-aarch64,  os: macos-latest,     target: aarch64-apple-darwin }
          - { name: macos-x86_64,   os: macos-latest,     target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
          # Command line only, no GUI libraries needed: for CI servers and containers.
          - { name: linux-x86_64-cli, os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, cli: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install GUI build dependencies
        if: runner.os == 'Linux' && !matrix.cli
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.cli && '--no-default-features' || '' }}
      - name: Package
        shell: bash
        run: |
          dir="polibre-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          bin=polibre
          [ "$RUNNER_OS" = Windows ] && bin=polibre.exe
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE "$dir/"
          cp assets/fonts/Inter-LICENSE.txt "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" >/dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
