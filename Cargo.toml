[package]
name = "polibre"
version = "0.9.3"
edition = "2021"
rust-version = "1.86"
license = "AGPL-3.0-or-later"
description = "Automatically fill untranslated gettext .po strings using LLMs or LibreTranslate"
resolver = "3"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:ab_glyph"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ctrlc = "3"
# Checks which scripts a system font covers (already used by egui).
ab_glyph = { version = "0.2", optional = true }
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
