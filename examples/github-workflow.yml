# Example: translate missing strings on demand and open a pull request.
# Copy to .github/workflows/polibre.yml in your project.
name: PoLibre
on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma separated locale codes, or 'all'"
        default: "all"
jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Build PoLibre (CLI only)
        run: cargo install --git https://github.com/YOUR_ORG/PoLibre --no-default-features
      - name: Translate
        env:
          POLIBRE_PROVIDER: anthropic          # or libretranslate, openai, google, ...
          POLIBRE_MODEL: claude-opus-5-5
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLIBRE_LANGS: ${{ inputs.languages }}
        run: polibre translate . --no-config --report polibre-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: polibre-report
          path: polibre-report.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: polibre
          title: "Machine translations (fuzzy, needs review)"
          body: "Entries filled by PoLibre are marked `#, fuzzy` and carry a `# Translated by <model> on <date>, needs review` comment."
          add-paths: "**/*.po"
